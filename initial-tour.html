<!DOCTYPE html>
<!--
  initial-tour.html
  ─────────────────
  S'executa dins un <iframe> transparent, full-screen,
  carregat per index.html en la primera visita.
  Accedeix al DOM del pare via window.parent.document
  (same-origin, sense cap problema de seguretat).
  El contingut de cada pas ve de initial-tour.json.
-->
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tour</title>
  <style>

    /* ── Reset: iframe transparent ─────────────────────── */
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Space Mono', 'Courier New', monospace;
    }

    /* ── Contenidor arrel ───────────────────────────────── */
    #tour-root {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    /* ── Capa fosca quan no hi ha target ────────────────── */
    #tour-overlay {
      position: fixed;
      inset: 0;
      background: transparent;
      transition: background 0.3s ease;
      pointer-events: none;
      z-index: 1;
    }

    #tour-root.no-target #tour-overlay {
      background: rgba(0, 0, 0, 0.62);
      pointer-events: all;
    }

    /* ── Spotlight ──────────────────────────────────────── */
    #tour-spotlight {
      position: fixed;
      z-index: 2;
      border-radius: 6px;
      pointer-events: none;

      /* La box-shadow gegant enfosqueix tot el que queda fora */
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.82);

      /* Vora rosa per identificar clarament la zona */
      outline: 3px solid #B9138D;
      outline-offset: 2px;
      animation: tour-pulse 2s ease-in-out infinite;

      opacity: 0;
      transition:
        top    0.4s cubic-bezier(0.4, 0, 0.2, 1),
        left   0.4s cubic-bezier(0.4, 0, 0.2, 1),
        width  0.4s cubic-bezier(0.4, 0, 0.2, 1),
        height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
        opacity 0.3s ease;
    }

    #tour-root.has-target #tour-spotlight {
      opacity: 1;
    }

    @keyframes tour-pulse {
      0%, 100% { outline-color: rgba(185, 19, 141, 0.55); }
      50%       { outline-color: rgba(185, 19, 141, 1.0);  }
    }

    /* ── Panell d'explicació ────────────────────────────── */
    #tour-panel {
      position: fixed;
      z-index: 10;
      width: clamp(280px, 90vw, 390px);
      pointer-events: all;

      background: #ffffff;
      border-radius: 10px;
      border: 1px solid rgba(185, 19, 141, 0.3);
      box-shadow:
        0 0 0 1px rgba(185, 19, 141, 0.07),
        0 12px 48px rgba(0, 0, 0, 0.28);

      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    #tour-panel.hiding {
      opacity: 0;
      transform: scale(0.97);
      pointer-events: none;
    }

    #tour-panel.tour-center {
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
    }

    #tour-panel.tour-center.hiding {
      transform: translate(-50%, -50%) scale(0.97) !important;
    }

    /* ── Contingut ──────────────────────────────────────── */
    #tour-inner {
      padding: 1.5rem 1.6rem 1.25rem;
    }

    #tour-counter {
      margin: 0 0 0.55rem;
      font-size: 0.6rem;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: #B9138D;
    }

    #tour-title {
      margin: 0 0 0.7rem;
      font-size: 1.05rem;
      font-weight: 700;
      color: #111;
      line-height: 1.3;
    }

    #tour-body {
      font-size: 0.77rem;
      line-height: 1.75;
      color: #555;
    }

    #tour-body strong { color: #111; }

    #tour-body code {
      display: inline-block;
      background: #f4f4f4;
      border: 1px solid #ddd;
      border-radius: 3px;
      padding: 0 5px;
      font-size: 0.73rem;
      color: #222;
    }

    #tour-body a {
      color: #B9138D;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    /* ── Footer: punts + botons ─────────────────────────── */
    #tour-footer {
      border-top: 1px solid #eee;
      padding: 0.85rem 1.6rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    #tour-dots {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ddd;
      transition: background 0.2s, transform 0.2s;
      flex-shrink: 0;
    }

    .dot.on {
      background: #B9138D;
      transform: scale(1.35);
    }

    #tour-btns {
      display: flex;
      gap: 0.45rem;
    }

    button {
      font-family: 'Space Mono', 'Courier New', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.4px;
      border-radius: 5px;
      cursor: pointer;
      padding: 0.38rem 0.8rem;
      border: 1px solid #d0d0d0;
      background: transparent;
      color: #777;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      white-space: nowrap;
    }

    button:hover        { border-color: #555; color: #222; }
    button:disabled     { opacity: 0.3; cursor: default; pointer-events: none; }

    #btn-next {
      border-color: rgba(185, 19, 141, 0.5);
      color: #B9138D;
      background: rgba(185, 19, 141, 0.06);
    }

    #btn-next:hover {
      border-color: #B9138D;
      background: rgba(185, 19, 141, 0.14);
      color: #8f0f6a;
    }

  </style>
</head>
<body>

<div id="tour-root">
  <div id="tour-overlay"></div>
  <div id="tour-spotlight"></div>

  <div id="tour-panel">
    <div id="tour-inner">
      <p id="tour-counter"></p>
      <h2 id="tour-title"></h2>
      <div id="tour-body"></div>
    </div>
    <div id="tour-footer">
      <div id="tour-dots"></div>
      <div id="tour-btns">
        <button id="btn-skip">Saltar</button>
        <button id="btn-prev" disabled>← Anterior</button>
        <button id="btn-next">Següent →</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const root      = document.getElementById('tour-root');
  const spotlight = document.getElementById('tour-spotlight');
  const panel     = document.getElementById('tour-panel');
  const elCounter = document.getElementById('tour-counter');
  const elTitle   = document.getElementById('tour-title');
  const elBody    = document.getElementById('tour-body');
  const elDots    = document.getElementById('tour-dots');
  const btnSkip   = document.getElementById('btn-skip');
  const btnPrev   = document.getElementById('btn-prev');
  const btnNext   = document.getElementById('btn-next');

  /* Accés directe al document pare (same-origin) */
  const parentDoc = window.parent.document;

  let steps   = [];
  let current = 0;
  let busy    = false;

  /* ── Carrega el JSON ──────────────────────────────────── */
  fetch('initial-tour.json')
    .then(r => r.json())
    .then(data => {
      steps = data;
      buildDots();
      render(0, false);
    })
    .catch(err => {
      console.error('[Tour] initial-tour.json no carregat:', err);
      closeTour();
    });

  /* ── Dots ─────────────────────────────────────────────── */
  function buildDots() {
    elDots.innerHTML = '';
    steps.forEach(() => {
      const d = document.createElement('span');
      d.className = 'dot';
      elDots.appendChild(d);
    });
  }

  function syncDots(idx) {
    elDots.querySelectorAll('.dot').forEach((d, i) =>
      d.classList.toggle('on', i === idx)
    );
  }

  /* ── Renderitza un pas ────────────────────────────────── */
  function render(idx, animate) {
    if (busy) return;
    busy    = true;
    current = idx;

    const step   = steps[idx];
    const isLast = (idx === steps.length - 1);

    const apply = () => {
      elCounter.textContent        = `Pas ${idx + 1} de ${steps.length}`;
      elTitle.textContent          = step.title;
      elBody.innerHTML             = step.text;
      btnPrev.disabled             = (idx === 0);
      btnNext.textContent          = isLast ? 'Tancar el tour ✓' : 'Següent →';
      btnSkip.style.visibility     = isLast ? 'hidden' : 'visible';
      syncDots(idx);
      positionStep(step);
      panel.classList.remove('hiding');
      busy = false;
    };

    if (animate) {
      panel.classList.add('hiding');
      setTimeout(apply, 210);
    } else {
      apply();
    }
  }

  /* ── Spotlight + panell ───────────────────────────────── */
  function positionStep(step) {
    if (!step.target) { showNoTarget(); return; }

    const el = parentDoc.querySelector(step.target);
    if (!el) {
      console.warn('[Tour] No s\'ha trobat:', step.target);
      showNoTarget();
      return;
    }

    const rect = el.getBoundingClientRect();

    root.classList.add('has-target');
    root.classList.remove('no-target');

    const PAD = 8;
    spotlight.style.top    = (rect.top    - PAD) + 'px';
    spotlight.style.left   = (rect.left   - PAD) + 'px';
    spotlight.style.width  = (rect.width  + PAD * 2) + 'px';
    spotlight.style.height = (rect.height + PAD * 2) + 'px';

    panel.classList.remove('tour-center');
    placePanel(rect, step.panelPosition || 'right', PAD);
  }

  function showNoTarget() {
    root.classList.remove('has-target');
    root.classList.add('no-target');
    spotlight.style.width  = '0';
    spotlight.style.height = '0';
    panel.classList.add('tour-center');
  }

  /* ── Posiciona el panell ──────────────────────────────── */
  function placePanel(rect, pref, pad) {
    const W    = 390 + 24;
    const H    = 270;
    const GAP  = 20;
    const EDGE = 12;
    const vw   = window.innerWidth;
    const vh   = window.innerHeight;

    const order = [pref, ...['right', 'left', 'below', 'above'].filter(p => p !== pref)];

    for (const pos of order) {
      let top, left, fits;

      if (pos === 'right') {
        left = rect.right + pad + GAP;
        top  = clamp(rect.top + rect.height / 2 - H / 2, EDGE, vh - H - EDGE);
        fits = left + W <= vw - EDGE;
      } else if (pos === 'left') {
        left = rect.left - pad - GAP - W;
        top  = clamp(rect.top + rect.height / 2 - H / 2, EDGE, vh - H - EDGE);
        fits = left >= EDGE;
      } else if (pos === 'below') {
        top  = rect.bottom + pad + GAP;
        left = clamp(rect.left + rect.width / 2 - W / 2, EDGE, vw - W - EDGE);
        fits = top + H <= vh - EDGE;
      } else {
        top  = rect.top - pad - GAP - H;
        left = clamp(rect.left + rect.width / 2 - W / 2, EDGE, vw - W - EDGE);
        fits = top >= EDGE;
      }

      if (fits) { panel.style.top = top + 'px'; panel.style.left = left + 'px'; return; }
    }

    /* Fallback */
    panel.style.top  = (vh - H - 20) + 'px';
    panel.style.left = (vw - W - 20) + 'px';
  }

  function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }

  /* ── Events ───────────────────────────────────────────── */
  btnNext.addEventListener('click', () => {
    if (current >= steps.length - 1) closeTour();
    else render(current + 1, true);
  });

  btnPrev.addEventListener('click', () => {
    if (current > 0) render(current - 1, true);
  });

  btnSkip.addEventListener('click', closeTour);

  document.addEventListener('keydown', e => {
    if      (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); btnNext.click(); }
    else if (e.key === 'ArrowLeft')                       { e.preventDefault(); btnPrev.click(); }
    else if (e.key === 'Escape')                           closeTour();
  });

  /* ── Tanca el tour ────────────────────────────────────── */
  function closeTour() {
    localStorage.setItem('karel_tour_done_v1', '1');
    const iframe = parentDoc.getElementById('tour-iframe');
    if (iframe) {
      iframe.style.transition = 'opacity 0.3s ease';
      iframe.style.opacity    = '0';
      setTimeout(() => iframe.remove(), 350);
    }
  }

  /* ── Resize ───────────────────────────────────────────── */
  let rt;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => { if (steps[current]) positionStep(steps[current]); }, 100);
  });

})();
</script>

</body>
</html>
