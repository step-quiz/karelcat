<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karel en Català 🤖</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══ CAPÇALERA ══ -->
<header class="topbar">
  <div class="logo">🤖 <span>Karel en Català</span></div>

  <div id="state-badge">
    <div id="state-dot"></div>
    <span id="state-lbl">aturat</span>
  </div>

  <div class="topbar-actions">
    <button class="btn" onclick="openChallenges()">🎯 Reptes</button>
    <a class="btn" href="edit-mapa.html">✏️ Editar mapa</a>
    <button class="btn" onclick="toggleLight()" title="Mode fosc / clar">◑</button>
  </div>
</header>


<!-- ══ LAYOUT PRINCIPAL ══ -->
<div class="main">

  <!-- ── Columna esquerra: MÓN DE KAREL ── -->
  <div class="map-col">

    <!-- Graella del món -->
    <div class="world-area" id="world-area">
      <div id="world-grid"></div>
    </div>

    <!-- Barra d'estat (posició, direcció, motxilla) -->
    <div class="status-bar">
      <span>Posició: <strong id="st-pos">—</strong></span>
      <span>Direcció: <strong id="st-dir">—</strong></span>
      <span>Motxilla: <strong id="st-bag">0</strong> 💧</span>
    </div>

    <!-- Controls d'execució (just a sota del mapa) -->
    <div class="exec-controls">
      <div class="btns">
        <button class="btn p" id="btn-run"  onclick="runProgram()">▶ Executa</button>
        <button class="btn g" id="btn-step" onclick="stepProgram()">⏭ Pas</button>
        <button class="btn r"               onclick="stopProgram()">■ Para</button>
        <button class="btn"                 onclick="resetKarel()">↺ Reinicia</button>
        <button class="btn"                 onclick="clearLog()">⌫ Log</button>
      </div>
      <div class="speed-row">
        Velocitat:
        <input type="range" id="speed" min="50" max="1000" value="600" step="50">
        <span id="speed-lbl">normal</span>
      </div>
    </div>

  </div><!-- fi .map-col -->


  <!-- ── Columna dreta: EDITOR DE CODI ── -->
  <div class="code-col">

    <!-- Editor amb ressaltat sintàctic i números de línia -->
    <div class="editor-wrap">
      <div id="line-numbers"></div>
      <div class="editor-inner">
        <pre id="code-highlight" aria-hidden="true"></pre>
        <textarea id="code-editor" spellcheck="false">// Karel recull totes les aigües
// que troba en línia recta fins la paret

mentre(veu-lliure) {
  si(veu-aigua) {
    agafa
  }
  avança
}

// Gira i deixa les aigües recollides
gira.esquerra
repeteix(3) {
  si(no(veu-paret)) {
    deixa
    avança
  }
}</textarea>
      </div>
    </div>

    <!-- Log d'execució (redimensionable) -->
    <div id="log-wrap">
      <div id="log-resize" title="Arrossega per canviar la mida del log"></div>
      <div id="log"></div>
    </div>

  </div><!-- fi .code-col -->

</div><!-- fi .main -->


<!-- ══ MODALS ══ -->

<!-- Modal: Reptes -->
<div class="modal-bg" id="modal-challenges">
  <div class="modal modal-wide">
    <div class="modal-hd">
      <span>🎯 Reptes — tria un exercici per començar</span>
      <button onclick="closeModal('modal-challenges')">✕</button>
    </div>
    <div id="challenges-list"></div>
    <div class="modal-ft">
      <button class="btn" onclick="closeModal('modal-challenges')">Tanca</button>
    </div>
  </div>
</div>

<script src="karel.js"></script>
</body>
</html>
