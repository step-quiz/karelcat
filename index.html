<script>
(function() {
  var btn = document.getElementById('karel-nav-toggle');
  var drw = document.getElementById('karel-nav-drawer');
  if (!btn || !drw) return;
  btn.addEventListener('click', function() {
    var open = drw.classList.toggle('is-open');
    btn.setAttribute('aria-expanded', open);
    btn.textContent = open ? '✕' : '☰';
  });
  document.addEventListener('click', function(e) {
    if (!btn.contains(e.target) && !drw.contains(e.target)) {
      drw.classList.remove('is-open');
      btn.setAttribute('aria-expanded', 'false');
      btn.textContent = '☰';
    }
  });
})();
</script>

<!-- ══════════════════════════════════════════════════════
     Tour de benvinguda — es carrega només la primera visita
     ══════════════════════════════════════════════════════ -->
<script>
(function () {
  if (localStorage.getItem('karel_tour_done_v1')) return;

  var iframe = document.createElement('iframe');
  iframe.id                    = 'tour-iframe';
  iframe.src                   = 'initial-tour.html';
  iframe.allowTransparency     = true;
  iframe.setAttribute('allowtransparency', 'true');
  iframe.setAttribute('title', 'Tour de benvinguda');
  iframe.style.cssText =
    'position:fixed;inset:0;width:100%;height:100%;' +
    'border:none;background:transparent;z-index:9990;';
  document.body.appendChild(iframe);
})();
</script>
